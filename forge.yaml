# =============================================================================
# PROJECT (REQUIRED)
# =============================================================================

project:
  name: "Reelwright"
  owner: "RapierCraftStudios"
  repo: "reelwright"
  description: "AI-run creator studio: script, teleprompter, auto-edit, motion style, Shorts, publishing and analytics for the @itsMrDubey channel."
# =============================================================================
# PATHS (REQUIRED)
# =============================================================================
paths:
  root: "/home/dev/Projects/ytchannel"
  worktree_base: "/home/dev/Projects/ytchannel/.claude/worktrees"
# =============================================================================
# BRANCHES (REQUIRED)
# =============================================================================
branches:
  default: "main"
  staging: "staging"
  feature_pattern: "milestone/{slug}"
# =============================================================================
# EXECUTION — lanes run on computeshare hosts (legion now; mrdubey-1 once enrolled)
# =============================================================================
execution:
  mode: local
  max_remote: 12
  provider: pool
  token_env: COMPUTESHARE_TOKEN
  fallback_local: true
  account_rotator: tokenbaton
