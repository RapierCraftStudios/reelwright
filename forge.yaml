# =============================================================================
# REVIEW (OPTIONAL) — context injected into review agent prompts.
# =============================================================================
review:
  tech_stack: "Python 3.12 (uv, FastAPI, Pydantic v2, SQLModel/SQLite, Typer), WhisperX, OpenTimelineIO via spectracut.edit, ffmpeg NVENC, TypeScript (Vite+React dashboard/prompter, Playwright virtual-clock motion renderer), Recordly fork (Electron)"
  context: |
    Reelwright is a greenfield AGPL creator studio. Source of truth: docs/engineering/technical-spike.md;
    every issue cites the spike section it implements. Invariants: the Script/Beat/Cue model is the source of
    truth everything else points back to; nothing publishes or sends without a recorded human approval;
    raw footage never lands on the dev server (disk-budget check before writes); GPU work goes through the
    worker picker, never hard-coded to a host; MrDubey jobs run low priority and yield; every external
    service has a mock provider so dev and CI never need real credentials; secrets only in keychain/.env.
verification:
  commands:
    python:
      lint: uv run ruff check .
      format: uv run ruff format --check .
      typecheck: uv run mypy
      test: uv run pytest -q
    typescript:
      typecheck: pnpm -r typecheck
      lint: pnpm -r lint
      test: pnpm -r test
