# Alembic CLI config. The app applies migrations itself (reelwright.db.session.migrate);
# this file is for generating revisions: uv run alembic revision --autogenerate -m "<msg>"
# The database URL comes from REELWRIGHT_DB_URL (see migrations/env.py).
[alembic]
script_location = reelwright:db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
