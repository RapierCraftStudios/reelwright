[project]
name = "reelwright"
version = "0.0.0"
description = "AI-run creator studio: script, teleprompter, auto-edit, motion style, Shorts, publishing and analytics."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "alterlab>=2.4.5",
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "spectracut @ git+https://github.com/RapierCraftStudios/spectracut@c19d40c3c00a2550b35eff16e4be770d463a20f6",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
rw = "reelwright.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reelwright"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reelwright", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alterlab", "alterlab.*", "spectracut", "spectracut.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["e2e"]
